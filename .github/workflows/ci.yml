name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build static binary
        run: |
          go build -trimpath \
            -ldflags "-s -w -X github.com/talvor/otman/internal/cli.Version=${GITHUB_SHA::12}" \
            -o dist/otman-${GOOS}-${GOARCH} ./cmd/otman
      - uses: actions/upload-artifact@v4
        with:
          name: otman-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/otman-${{ matrix.goos }}-${{ matrix.goarch }}
